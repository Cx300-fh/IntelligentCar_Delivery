name: Apply Frame EEG Index Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_frame_eeg_index.py'
      - '.github/workflows/apply-frame-eeg-index.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Transcode frame video
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -y -i docs/assets/media/frame.mov -map 0:v:0 -map 0:a:0? -c:v libx264 -preset medium -crf 24 -pix_fmt yuv420p -c:a aac -b:a 96k -movflags +faststart docs/assets/media/frame.mp4
      - name: Apply HTML patch
        run: python .github/scripts/apply_frame_eeg_index.py
      - name: Validate
        run: |
          test -s docs/assets/media/frame.mp4
          grep -q 'data-proxy-video="frame.mp4"' docs/index.html
          grep -q 'assets/media/eeg-demo.mp4' docs/index.html
          grep -q 'FRAME + EEG + INDEX LOCK v1 BEGIN' docs/index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html docs/assets/media/frame.mp4
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Bind frame video, lock System index and prepare EEG demo'
          git push
