name: Apply Navigation Campus Demo

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/bind_navigation_campus_demo.py'
      - '.github/workflows/apply-navigation-campus-demo.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply binding
        run: python .github/scripts/bind_navigation_campus_demo.py
      - name: Validate
        run: |
          grep -q 'data-campus-demo="1"' docs/index.html
          grep -q 'assets/media/campus-demo.mp4' docs/index.html
          grep -q 'NAVIGATION CAMPUS DEMO v1 BEGIN' docs/index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Bind Navigation to campus demo video'
          git push
