name: Apply Robot Blueprint Trial

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-robot-blueprint-trial.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply blueprint trial
        run: python .github/scripts/apply_robot_blueprint_trial.py
      - name: Validate
        run: |
          grep -q 'ROBOT BLUEPRINT TRIAL v1 BEGIN' docs/index.html
          grep -q 'robot-blueprint' docs/index.html
          grep -q 'Turn Around' docs/index.html
          grep -q 'Dynamic rerouting' docs/index.html
          grep -q '5 ms control' docs/index.html
          git diff --check
      - name: Commit trial
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Try robot-centered System blueprint layout"
          git push origin main
