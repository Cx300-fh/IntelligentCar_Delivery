name: Apply System Cinema Titles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-system-cinema-titles.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply title pass
        run: python .github/scripts/rename_system_cinema_titles.py
      - name: Validate
        run: |
          grep -q 'From Problem To Answer' docs/index.html
          grep -q 'Mission: Impossible' docs/index.html
          grep -q 'Fast &amp; Furious' docs/index.html
          grep -q 'No Time to Die' docs/index.html
          grep -q 'Brand New Car' docs/index.html
          grep -q 'system-cinema-title-pass' docs/index.html
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Refine System heading and cinema-inspired section titles"
          git push origin main
