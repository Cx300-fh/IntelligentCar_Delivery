name: Apply System Four Modules

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-system-four-modules.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply redesign
        run: python .github/scripts/apply_system_four_modules.py
      - name: Validate
        run: |
          grep -q 'SYSTEM FOUR MODULES v2 BEGIN' docs/index.html
          grep -q 'Brain-wave / EEG controlled car' docs/index.html
          grep -q 'data-four="future"' docs/index.html
          grep -q 'system-robot-core' docs/index.html
          grep -q 'Dynamic rerouting' docs/index.html
          git diff --check
      - name: Commit redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Reorganize System into four distinct modules"
          git push origin main
