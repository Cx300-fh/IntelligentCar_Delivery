name: Apply System Index Scroll Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_system_index_scroll.py'
      - '.github/workflows/apply-system-index-scroll-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fix
        run: python .github/scripts/fix_system_index_scroll.py
      - name: Validate
        run: |
          grep -q 'SYSTEM INDEX + SCROLL FIX v1 BEGIN' docs/index.html
          grep -q "\['future', '04', 'To-do'\]" docs/index.html
          grep -q 'From Problem To Answer' docs/index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Restore functional System index and unified scrolling'
          git push
