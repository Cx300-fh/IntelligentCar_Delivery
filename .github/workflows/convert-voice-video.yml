name: Convert voice demo video

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/convert-voice-video.yml'

permissions:
  contents: write

jobs:
  convert-and-link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Convert voice.mov to browser-compatible MP4
        shell: bash
        run: |
          ffmpeg -y -i docs/assets/media/voice.mov \
            -c:v libx264 -preset medium -crf 24 -pix_fmt yuv420p \
            -c:a aac -b:a 128k \
            -movflags +faststart \
            docs/assets/media/voice.mp4

      - name: Link Voice gateway card to video
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/index.html')
          text = path.read_text(encoding='utf-8')

          old = '<article class="evidence-card" data-proxy-code="voice"><span class="evidence-type">Source code</span><h4>Voice gateway</h4><p>Natural-language requests enter the same task pipeline as the web UI.</p></article>'
          new = '<article class="evidence-card" data-proxy-video="voice.mp4"><span class="evidence-type">Video</span><h4>Voice gateway</h4><p>Natural-language requests enter the same task pipeline as the web UI.</p></article>'

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one visible Voice gateway card, found {count}')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit converted video and page update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/convert-voice-video.yml
          git add docs/assets/media/voice.mp4 docs/index.html
          git commit -m "Add Voice gateway demo video"
          git push origin HEAD:main
