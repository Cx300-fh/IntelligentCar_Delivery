name: Fix System media and visual design

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-media-visual-system.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Convert MOV demos to browser-safe MP4
        run: |
          set -e
          for name in turnaround obstacle weight; do
            ffmpeg -y \
              -i "docs/assets/media/${name}.mov" \
              -map 0:v:0 -map '0:a:0?' \
              -c:v libx264 -preset medium -crf 24 -pix_fmt yuv420p \
              -c:a aac -b:a 128k \
              -movflags +faststart \
              "docs/assets/media/${name}.mp4"
          done

      - name: Apply System visual redesign
        run: python .github/scripts/fix_media_visual_system.py

      - name: Validate
        run: |
          test -s docs/assets/media/turnaround.mp4
          test -s docs/assets/media/obstacle.mp4
          test -s docs/assets/media/weight.mp4
          grep -q 'assets/media/turnaround.mp4' docs/index.html
          grep -q 'assets/media/obstacle.mp4' docs/index.html
          grep -q 'assets/media/weight.mp4' docs/index.html
          grep -q 'System visual storytelling + density v3' docs/index.html
          grep -q 'feature-visual' docs/index.html
          grep -q 'problem-visual pv-order' docs/index.html
          git diff --check

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html \
                  docs/assets/media/turnaround.mp4 \
                  docs/assets/media/obstacle.mp4 \
                  docs/assets/media/weight.mp4
          git commit -m "Fix System videos and add visual storytelling"
          git push origin main
