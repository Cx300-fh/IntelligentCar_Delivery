name: Fix Overview Flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-overview-flow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix Overview layout flow
        run: python .github/scripts/fix_overview_flow.py

      - name: Validate and commit
        shell: bash
        run: |
          set -e
          grep -q '.app-view-overview .hero-scroll-hint {' docs/index.html
          grep -q 'position: absolute !important;' docs/index.html
          grep -q '.app-view-overview .hero::after {' docs/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --check
          git commit -m "Fix Overview title flow and bottom band"
          git push origin main
