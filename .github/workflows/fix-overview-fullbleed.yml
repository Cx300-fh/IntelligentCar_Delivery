name: Fix Overview Full Bleed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-overview-fullbleed.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Apply full-bleed Overview background
        run: python .github/scripts/fix_overview_fullbleed.py
      - name: Validate and commit
        shell: bash
        run: |
          set -e
          grep -q 'Overview root full-bleed background v2' docs/index.html
          grep -q '.app-view-overview .hero-visuals' docs/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --check
          git commit -m "Move Overview slideshow to full-view background"
          git push origin main
