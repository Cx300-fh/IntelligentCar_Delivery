name: Fix System Scroll

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-system-scroll.yml'

permissions:
  contents: write

jobs:
  fix-scroll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch System scroll alignment
        run: python .github/scripts/fix_system_scroll.py

      - name: Validate and commit
        shell: bash
        run: |
          set -e
          grep -q 'Scroll through six linked scenes' docs/index.html
          grep -q 'const targetTop = target.getBoundingClientRect().top' docs/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --check
          git commit -m "Fix System story scroll alignment"
          git push origin main
