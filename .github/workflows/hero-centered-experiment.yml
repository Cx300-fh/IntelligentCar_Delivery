name: Hero centered experiment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hero-centered-experiment.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply centered hero
        run: python .github/hero_centered_experiment.py
      - name: Commit centered hero and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git rm .github/hero_centered_experiment.py .github/workflows/hero-centered-experiment.yml
          git commit -m "experiment with centered full-screen hero"
          git push
