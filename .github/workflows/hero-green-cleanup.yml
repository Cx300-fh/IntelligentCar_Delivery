name: Hero green cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hero-green-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/hero_green_cleanup.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git rm .github/hero_green_cleanup.py .github/workflows/hero-green-cleanup.yml
          git commit -m "reduce hero green accents"
          git push
