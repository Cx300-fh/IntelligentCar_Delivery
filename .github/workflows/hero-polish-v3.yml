name: Hero polish v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hero-polish-v3.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply hero polish
        run: python .github/hero_polish_v3.py
      - name: Commit result and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git rm .github/hero_polish_v3.py .github/workflows/hero-polish-v3.yml
          git commit -m "polish hero HUD and CTA hierarchy"
          git push
