name: Apply hero refinement v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hero-refine-v2.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply hero refinement
        run: python .github/hero_refine_v2.py

      - name: Commit result and remove temporary tooling
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git rm .github/hero_refine_v2.py .github/workflows/hero-refine-v2.yml
          git commit -m "refine hero composition and navigation"
          git push
