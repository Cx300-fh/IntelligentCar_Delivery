name: Apply focused hero refinements

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/hero-refine.yml'
      - 'tools/hero_refine.py'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply hero refinement
        run: python tools/hero_refine.py

      - name: Commit result and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git rm .github/workflows/hero-refine.yml tools/hero_refine.py
          git commit -m "refine homepage hero composition"
          git push
