name: Materialize system media

on:
  push:
    paths:
      - '.github/workflows/materialize-system-media.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: media-upload-20260904
          fetch-depth: 0

      - name: Decode System demo videos
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode docs/assets/media/system/.upload2/order-full.b64 > docs/assets/media/system/order-web.mp4
          base64 --decode docs/assets/media/system/.upload2/move-full.b64 > docs/assets/media/system/move-navigation.mp4
          test -s docs/assets/media/system/order-web.mp4
          test -s docs/assets/media/system/move-navigation.mp4

          rm -rf docs/assets/media/system/.upload docs/assets/media/system/.upload2
          rm -f docs/assets/media/system/order-web.mp4.b64
          rm -f .github/workflows/materialize-system-media.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add System demo videos'
          git push origin HEAD:media-upload-20260904
