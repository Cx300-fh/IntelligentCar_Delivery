name: Patch order page link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-order-link.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Link gateway node to order page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/index.html')
          text = path.read_text(encoding='utf-8')
          old = '<button class="system-node is-action" type="button" data-proxy-code="gateway"><span class="node-type">Networking</span><strong>PC ↔ Car gateway</strong><small>Commands, heartbeat, events</small></button>'
          new = '<a class="system-node is-action" href="http://192.168.43.73:3000/" target="_blank" rel="noopener noreferrer" style="text-decoration:none"><span class="node-type">Networking</span><strong>PC ↔ Car gateway</strong><small>Commands, heartbeat, events</small></a>'

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one gateway node, found {count}')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-order-link.yml
          git add docs/index.html
          git commit -m "Link gateway node to order page"
          git push origin HEAD:main
