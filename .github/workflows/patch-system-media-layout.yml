name: Patch System media and layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-system-media-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python .github/scripts/patch_system_media_layout.py

      - name: Validate
        run: |
          grep -q 'assets/media/weight.mov' docs/index.html
          grep -q 'assets/media/obstacle.mov' docs/index.html
          grep -q '<h4>Navigation & rerouting</h4>' docs/index.html
          grep -q 'System density + modal cursor fix v2' docs/index.html
          grep -q 'body.fx-cursor-on.feature-code-open .feature-code-modal' docs/index.html
          git diff --check

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Fix System cursor, videos and layout"
          git push origin main
