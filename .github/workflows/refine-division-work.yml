name: Refine Division of Work

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-division-work.yml'

permissions:
  contents: write

jobs:
  refine-division:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply Division of Work refinement
        run: python .github/scripts/refine_division_work.py

      - name: Validate and commit
        shell: bash
        run: |
          set -e
          grep -q 'Division work cards v2' docs/index.html
          grep -q 'class="member-bio-tooltip"' docs/index.html
          grep -q 'data-name="Gan Hongwen"' docs/index.html
          grep -q 'data-name="Li Yuxin"' docs/index.html
          grep -q 'data-name="Pu Renzhi"' docs/index.html
          grep -q 'font-size: 16px' docs/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --check
          git commit -m "Redesign Division of Work cards and member bios"
          git push origin main
