name: Refine Explore Why

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/refine_explore_why.py'
      - '.github/workflows/refine-explore-why.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Explore Why patch
        run: python .github/scripts/refine_explore_why.py
      - name: Validate
        run: |
          grep -q 'WHY QINGSONG ALTERNATING v2' docs/explore.html
          grep -q 'why-row why-row-a' docs/explore.html
          grep -q 'why-row why-row-b' docs/explore.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/explore.html
          git commit -m 'Refine Why Qingsong typography and alternating layout'
          git push
