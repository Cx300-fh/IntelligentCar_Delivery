name: Refine Typography and Copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-typography-copy.yml'

permissions:
  contents: write

# retry after normalizing legacy trailing whitespace
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply typography and copy refinements
        run: python .github/scripts/refine_typography_copy.py

      - name: Validate and commit
        shell: bash
        run: |
          set -e
          grep -q 'Watch Demo' docs/index.html
          grep -q 'System Design' docs/index.html
          grep -q 'Intertwined Roles, Unified Vision' docs/index.html
          grep -q 'System: From Problem To Answer' docs/index.html
          grep -q 'Typography hierarchy v1' docs/index.html
          ! grep -q 'Start with the situation, then reveal the engineering response' docs/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --check
          git commit -m "Refine typography hierarchy and page copy"
          git push origin main
