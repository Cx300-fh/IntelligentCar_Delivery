name: Remove map metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-map-meta.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply cleanup
        run: python .github/remove_map_meta.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git rm .github/remove_map_meta.py .github/workflows/remove-map-meta.yml
          git commit -m "remove demo and route metadata labels"
          git push
