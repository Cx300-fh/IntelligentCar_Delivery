name: System Card Navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/system-card-navigation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply System card navigation patch
        run: python .github/scripts/system_card_navigation.py

      - name: Validate and commit
        shell: bash
        run: |
          set -e
          grep -q 'System card navigation v1' docs/index.html
          grep -q 'id="moveRouteLab"' docs/index.html
          grep -q 'Interactive demo / Dynamic routing' docs/index.html
          grep -q 'feature-route-trigger' docs/index.html
          ! grep -q '>Demo ↗</button>' docs/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --check
          git commit -m "Make System feature cards direct demo links"
          git push origin main
