<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THU Delivery · 清送智能配送</title>
<style>
  :root{
    --bg:#05070D;
    --panel:#121621;
    --panel2:#0C0F19;
    --border:#22314F;
    --border-soft:rgba(34,49,79,.6);
    --blue:#5292FF;
    --blue-soft:rgba(82,146,255,.16);
    --blue-strong:rgba(82,146,255,.6);
    --from:#FF8787;
    --to:#5292FF;
    --green:#3DDCA6;
    --green-bg:#0F2E26;
    --carpool:#12B886;
    --gold:#FFC94D;
    --text:#EAF0FB;
    --text-soft:#8C96AD;
    --text-faint:#667087;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);overflow:hidden;
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;}
  #stage{
    position:fixed; inset:0;
    background:radial-gradient(115% 85% at 63% 32%, #17233d 0%, #0d1524 45%, #05070D 88%);
    overflow:hidden;
  }

  /* ---------- Map layer ----------
     Fixed 1440x900 logical box (matches the NODES/SVG coordinate system and
     Figma's own frame size), positioned in the right portion of the screen
     (left of it is reserved for the panel) and scaled via JS (layoutMap())
     to fit whatever's left of the viewport — native size when it fits,
     shrunk only when the screen is too small for it. */
  #mapLayer{
    position:absolute; left:50%; top:50%; width:1440px; height:900px;
    transform:translate(-50%,-50%);
    overflow:visible;
  }
  #roadLayer{position:absolute; inset:0; width:1440px; height:900px; pointer-events:none;}
  .road-base,.road-center{fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .road-base{stroke:#111A15;stroke-width:11;}
  .road-center{stroke:rgba(223,229,224,.28);stroke-width:3;}
  #routeSvg{position:absolute; inset:0; width:1440px; height:900px; pointer-events:none;}
  .route-track{fill:none; stroke:rgba(255,201,77,.6); stroke-width:5; stroke-linecap:round; stroke-dasharray:10 9;}
  .route-travelled{fill:none; stroke:var(--blue); stroke-width:6; stroke-linecap:round;
    filter:drop-shadow(0 0 6px rgba(82,146,255,.55));}
  .route-repositioning{fill:none; stroke:var(--text-soft); stroke-width:5; stroke-linecap:round; opacity:.7;}
  .route-preview{fill:none; stroke:var(--gold); stroke-width:3; stroke-linecap:round;
    stroke-dasharray:9 7; opacity:.95;}

  #pinLayer{position:absolute; inset:0;}
  #markerLayer{position:absolute; inset:0; pointer-events:none;}
  /* .pin is a zero-size anchor at the exact node coordinate — dot and label
     are independently-positioned absolute children (not a centered flex
     stack) so the dot itself sits pixel-exact on the road line; the label
     just hangs below it. */
  .pin{ position:absolute; cursor:pointer; user-select:none; }
  .pin-dot{
    position:absolute; left:0; top:0; transform:translate(-50%,-50%);
    width:14px; height:14px; border-radius:50%;
    background:#fff; box-shadow:0 0 0 5px rgba(255,255,255,.15);
    transition:all .18s ease;
  }
  .pin-label{
    position:absolute; left:0; top:13px; transform:translate(-50%,0);
    font-size:25px; font-weight:600; color:var(--text-soft);
    text-shadow:0 1px 4px rgba(0,0,0,.85), 0 0 8px rgba(0,0,0,.6);
    white-space:nowrap; transition:color .18s ease;
  }
  .pin:hover .pin-dot{background:#fff; box-shadow:0 0 0 6px rgba(255,255,255,.18); transform:translate(-50%,-50%) scale(1.15);}
  .pin:hover .pin-label{color:#fff;}
  .pin.is-from .pin-dot, .pin.is-to .pin-dot{opacity:0;}
  .pin.is-from .pin-label, .pin.is-to .pin-label{opacity:0;}

  /* Same zero-size-anchor pattern as .pin: the badge circle's own center
     must sit exactly on the node coordinate, independent of the tag label. */
  .endpoint-marker{ position:absolute; z-index:6; pointer-events:none; }
  .endpoint-badge{
    position:absolute; left:0; top:0; transform:translate(-50%,-50%);
    width:52px; height:52px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center;
    background:var(--from); border:2.5px solid var(--bg);
    box-shadow:0 2px 8px rgba(0,0,0,.5);
  }
  .endpoint-badge svg{width:24px; height:24px;}
  .endpoint-badge-to{background:var(--to);}
  .endpoint-tag{
    position:absolute; left:0; top:19px; transform:translate(-50%,0);
    font-size:25px; font-weight:700; white-space:nowrap;
    text-shadow:0 1px 4px rgba(0,0,0,.85), 0 0 8px rgba(0,0,0,.6);}
  .tag-from{color:var(--from);}
  .tag-to{color:var(--to);}

  /* Numbered stops (1=pickup, 2=dropoff) along the active order's route */
  .stop-marker{ position:absolute; z-index:11; pointer-events:none; }
  .stop-badge{
    position:absolute; left:0; top:0; transform:translate(-50%,-50%);
    width:52px; height:52px; border-radius:50%;
    background:var(--blue); color:#fff; font-size:26px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    border:2.5px solid var(--bg); box-shadow:0 2px 8px rgba(0,0,0,.5);
  }

  #robotMarker{
    position:absolute; width:52px; height:52px; transform:translate(-50%,-50%);
    display:flex; align-items:center; justify-content:center;
    filter:drop-shadow(0 2px 10px rgba(0,0,0,.5));
    z-index:10;
  }
  #robotMarker svg{width:52px; height:52px;}

  /* ---------- Wordmark ---------- */
  .wordmark{
    position:absolute; left:32px; top:24px; z-index:20;
    display:flex; align-items:center; gap:10px;
  }
  .wordmark-icon{
    width:35px; height:35px; display:flex; align-items:center; justify-content:center;
    filter:drop-shadow(0 4px 14px rgba(82,146,255,.35));
  }
  .wordmark-icon svg{width:35px; height:35px;}
  .wordmark-text{font-size:25px; font-weight:800; color:#EBF0FA; letter-spacing:.5px;}

  /* ---------- Hint chip ---------- */
  /* left centers over the map region (right of the 480px panel reserve),
     not the full viewport — calc(220px + 50vw) == 480px + (100vw-520px)/2 */
  #hintChip{
    position:absolute; top:28px; left:calc(220px + 50vw); transform:translateX(-50%); z-index:20;
    padding:10px 22px; border-radius:100px;
    background:rgba(18,22,33,.88); border:1px solid var(--border-soft);
    color:var(--text); font-size:20px; font-weight:500; white-space:nowrap;
    backdrop-filter:blur(6px);
  }

  /* ---------- Side panel ---------- */
  #sidePanel{position:absolute; left:32px; top:74px; width:400px; z-index:20;}
  .panel-card{
    background:var(--panel); border:1px solid var(--border); border-radius:20px;
    padding:20px 22px 18px; box-shadow:0 24px 60px rgba(0,0,0,.45);
  }
  .drag-handle{width:40px; height:4px; border-radius:2px; background:var(--border); margin:0 auto 14px;}
  .panel-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .panel-title{font-size:20px; font-weight:800; color:var(--text);}
  .count-pill{
    background:var(--blue-soft); color:var(--blue); font-size:20px; font-weight:700;
    padding:4px 12px; border-radius:100px;
  }
  .icon-btn{
    width:28px; height:28px; border-radius:8px; border:none; background:transparent;
    color:var(--text-soft); font-size:20px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{background:var(--panel2); color:var(--text);}

  .tabs{display:flex; gap:6px; background:var(--panel2); border-radius:12px; padding:4px; margin-bottom:14px;}
  .tab{
    flex:1; border:none; background:transparent; color:var(--text-soft);
    font-size:20px; font-weight:700; padding:9px 0; border-radius:9px; cursor:pointer;
    transition:all .15s ease;
  }
  .tab-active{background:var(--blue); color:#fff; box-shadow:0 4px 12px rgba(82,146,255,.35);}
  .tab:not(.tab-active):hover{color:var(--text);}

  .order-list{display:flex; flex-direction:column; gap:10px; max-height:560px; overflow-y:auto; padding-right:2px;}
  .order-list::-webkit-scrollbar{width:5px;}
  .order-list::-webkit-scrollbar-thumb{background:var(--border); border-radius:3px;}

  .order-card{
    background:var(--panel2); border:1.5px solid var(--border-soft); border-radius:14px; padding:13px 14px;
    cursor:default; transition:border-color .15s ease;
  }
  .order-card-active{border-color:var(--blue-strong);}
  .order-card-sub{border:1px solid var(--border); background:var(--panel2);}
  .order-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .order-id{font-size:20px; color:var(--text-faint); font-weight:600;}
  .badge{font-size:20px; font-weight:700; padding:3px 9px; border-radius:100px;}
  .badge-active{background:var(--blue); color:#fff;}
  .badge-waiting{background:rgba(255,201,77,.16); color:var(--gold);}
  .badge-queued{background:rgba(140,150,173,.16); color:var(--text-soft);}
  .badge-done{background:rgba(61,220,166,.16); color:var(--green);}
  .order-name{font-size:20px; font-weight:700; color:var(--text); margin-bottom:3px;}
  .order-route{font-size:20px; color:var(--text-soft);}
  .progress-track{height:5px; border-radius:3px; background:var(--border); margin-top:10px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--blue); border-radius:3px; transition:width .85s linear;
    box-shadow:0 0 8px rgba(82,146,255,.5);}

  .carpool-box{
    background:var(--green-bg); border:1px solid var(--carpool); border-radius:14px; padding:12px 12px 6px;
    display:flex; flex-direction:column; gap:8px;
  }
  .carpool-label{font-size:20px; font-weight:800; color:var(--carpool); margin-bottom:2px;
    display:flex; align-items:center; gap:6px;}

  .panel-footer{margin-top:14px; font-size:20px; color:var(--text-faint); text-align:center;}

  .empty-slogan{font-size:20px; font-weight:800; color:var(--to); text-align:center; margin:6px 0 14px;}
  .log-empty{color:var(--text-faint); font-size:20px; text-align:center; padding:20px 10px 36px; line-height:1.8;}

  /* ---------- Selection panel extras ---------- */
  .ft-card{position:relative; background:var(--panel2); border:1px solid var(--border); border-radius:14px; padding:4px 46px 4px 14px; margin-bottom:12px;}
  .ft-row{display:flex; align-items:center; gap:12px; padding:12px 0;}
  .ft-row + .ft-row{border-top:1px solid var(--border);}
  .ft-icon{width:26px; height:26px; border-radius:50%; background:var(--from); flex:none;
    display:flex; align-items:center; justify-content:center;}
  .ft-icon-to{background:var(--to);}
  .ft-text{display:flex; flex-direction:column; gap:2px; min-width:0;}
  .ft-tag{font-size:20px; font-weight:800; color:var(--from);}
  .ft-tag-to{color:var(--to);}
  .ft-val{font-size:20px; font-weight:700; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ft-placeholder{color:var(--text-faint); font-weight:500;}
  .status-line{font-size:20px; color:var(--to); text-align:center; padding:2px 4px 14px;}

  .swap-btn{
    position:absolute; right:12px; top:50%; transform:translateY(-50%);
    width:30px; height:30px; border-radius:50%; background:var(--panel); border:1px solid var(--border);
    color:var(--text-soft); font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all .15s ease;
  }
  .swap-btn:hover{color:var(--text); border-color:var(--blue-strong);}

  .eta-heading{font-size:20px; font-weight:750; color:var(--text); margin:10px 0 3px;}
  .eta-sub{font-size:13px; color:rgba(185,190,185,.58); margin-bottom:12px;}

  .name-field{display:grid;grid-template-columns:42px minmax(0,1fr);align-items:center;gap:8px;margin-bottom:12px;}
  .name-label{font-size:13px; font-weight:600; color:var(--text-faint); margin:0;}
  .name-input{width:100%; background:var(--panel2); border:1px solid var(--border); border-radius:12px;
    padding:9px 11px; font-size:15px; font-weight:650; color:var(--text); outline:none; font-family:inherit;}
  .name-input:focus{border-color:var(--blue-strong);}

  .sel-actions{display:flex; gap:10px;}
  .btn{flex:1; border:none; border-radius:12px; padding:13px 0; font-size:20px; font-weight:700; cursor:pointer; transition:all .15s ease;}
  .btn-primary{background:var(--blue); color:#fff; box-shadow:0 8px 20px rgba(82,146,255,.35);}
  .btn-primary:hover{background:#3f7fef;}
  .btn-ghost{background:var(--panel2); color:var(--text-soft); border:1px solid var(--border);}
  .btn-ghost:hover{color:var(--text);}

  /* ---------- Toast ---------- */
  #toast{
    position:absolute; top:28px; left:calc(220px + 50vw); transform:translate(-50%,-10px);
    background:rgba(18,22,33,.95); border:1px solid var(--border-soft); color:var(--text);
    padding:10px 22px 10px 14px; border-radius:100px; font-size:20px; font-weight:600;
    box-shadow:0 20px 50px rgba(0,0,0,.5); opacity:0; pointer-events:none; z-index:21;
    transition:all .28s cubic-bezier(.2,.9,.3,1.3); white-space:nowrap;
    display:flex; align-items:center; gap:8px;
  }
  #toast.show{opacity:1; transform:translate(-50%,0);}
  #toast .toast-check{
    width:18px; height:18px; border-radius:50%; background:var(--blue); flex:none;
    display:flex; align-items:center; justify-content:center;
  }
  #hintChip{transition:opacity .2s ease;}
  #hintChip.hint-hidden{opacity:0;}

  /* ---------- THU Delivery brand skin ----------
     Visual language is shared with the project website.  All runtime IDs,
     layout hooks and delivery functions below stay unchanged. */
  @font-face{
    font-family:"Prism";
    src:url("https://cx300-fh.github.io/IntelligentCar_Delivery/assets/fonts/Prism.otf?v=20260827-2") format("opentype");
    font-style:normal;
    font-weight:400;
    font-display:swap;
  }
  @font-face{
    font-family:"Yishanbei";
    src:url("https://cx300-fh.github.io/IntelligentCar_Delivery/assets/fonts/Yishanbei.ttf?v=20260827-1") format("truetype");
    font-style:normal;
    font-weight:400;
    font-display:swap;
  }
  @font-face{
    font-family:"Didot Delivery";
    src:url("/Didot-Bold-1.ttf") format("truetype");
    font-style:normal;
    font-weight:700;
    font-display:swap;
  }
  @font-face{
    font-family:"Noto Sans SC UI";
    src:url("https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.2.6/files/noto-sans-sc-chinese-simplified-400-normal.woff2") format("woff2");
    font-style:normal;
    font-weight:400;
    font-display:swap;
  }
  @font-face{
    font-family:"Noto Sans SC UI";
    src:url("https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.2.6/files/noto-sans-sc-chinese-simplified-700-normal.woff2") format("woff2");
    font-style:normal;
    font-weight:700 900;
    font-display:swap;
  }

  :root{
    color-scheme:dark;
    --bg:#0C0E0D;
    --panel:#151816;
    --panel2:#0F1210;
    --border:rgba(215,235,223,.14);
    --border-soft:rgba(215,235,223,.095);
    --blue:#76B900;
    --blue-soft:rgba(118,185,0,.18);
    --blue-strong:rgba(118,185,0,.68);
    --from:#70A4FF;
    --to:#D85B46;
    --green:#B9FF41;
    --green-bg:rgba(118,185,0,.09);
    --carpool:#91D62B;
    --gold:#E3A62F;
    --text:#F1F3F0;
    --text-soft:#B9BEB9;
    --text-faint:#8E948F;
  }

  html,body{
    background:#07100D;
    color:var(--text);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }

  #stage{
    isolation:isolate;
    background:
      radial-gradient(circle at 18% 10%,rgba(49,113,104,.22),transparent 34%),
      radial-gradient(circle at 82% 20%,rgba(118,185,0,.13),transparent 30%),
      radial-gradient(circle at 54% 86%,rgba(31,74,63,.17),transparent 40%),
      linear-gradient(145deg,#07100D 0%,#091410 44%,#07100D 100%);
  }
  #stage::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:-2;
    pointer-events:none;
    opacity:.64;
    background-image:
      linear-gradient(rgba(191,220,207,.044) 1px,transparent 1px),
      linear-gradient(90deg,rgba(191,220,207,.044) 1px,transparent 1px);
    background-size:42px 42px;
    -webkit-mask-image:radial-gradient(ellipse 88% 72% at 56% 40%,#000 20%,rgba(0,0,0,.82) 58%,transparent 100%);
    mask-image:radial-gradient(ellipse 88% 72% at 56% 40%,#000 20%,rgba(0,0,0,.82) 58%,transparent 100%);
  }
  #stage::after{
    content:"";
    position:absolute;
    inset:-20%;
    z-index:-1;
    pointer-events:none;
    background:radial-gradient(520px circle at 68% 28%,rgba(145,214,43,.038),rgba(49,118,104,.018) 36%,transparent 68%);
    filter:blur(8px);
    animation:ambientDrift 12s ease-in-out infinite alternate;
  }
  #stage{overflow:clip;}

  .wordmark{
    top:22px;
    gap:8px;
    min-height:38px;
    animation:brandEnter .75s cubic-bezier(.16,.85,.2,1) both;
  }
  .wordmark-icon,.wordmark-icon svg{width:33px;height:33px;}
  .wordmark-icon{
    filter:drop-shadow(0 0 13px rgba(118,185,0,.30));
    transition:transform .35s cubic-bezier(.2,.8,.2,1),filter .35s ease;
  }
  .wordmark:hover .wordmark-icon{
    transform:rotate(-7deg) scale(1.08);
    filter:drop-shadow(0 0 12px rgba(118,185,0,.50));
  }
  .wordmark-icon rect:first-of-type,
  #robotMarker rect:first-of-type{fill:#76B900;}
  .wordmark-text{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:4px;
    color:var(--text);
    line-height:1;
  }
  .wordmark-cn{
    font-family:"Yishanbei","STKaiti","KaiTi","Songti SC",serif;
    font-size:24px;
    font-weight:400;
    letter-spacing:.08em;
    line-height:1;
  }
  .wordmark-en{
    color:#A9EB36;
    font-family:"Prism","Arial Narrow","Helvetica Neue",Arial,sans-serif;
    font-size:10px;
    font-weight:400;
    letter-spacing:.12em;
    text-shadow:0 0 18px rgba(118,185,0,.22);
  }

  #hintChip{
    top:27px;
    padding:10px 20px;
    border-radius:4px;
    border-color:rgba(215,235,223,.12);
    background:linear-gradient(145deg,rgba(19,31,26,.84),rgba(8,15,12,.76));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 18px 52px rgba(0,0,0,.20);
    color:rgba(241,243,240,.82);
    font-size:15px;
    letter-spacing:.01em;
    backdrop-filter:blur(16px);
  }
  #hintChip::before{
    content:"";
    display:inline-block;
    width:7px;
    height:7px;
    margin-right:10px;
    border-radius:50%;
    background:#76B900;
    box-shadow:0 0 12px rgba(118,185,0,.9);
    vertical-align:1px;
    animation:statusPulse 2.4s ease-in-out infinite;
  }

  #sidePanel{
    top:82px;
    animation:panelEnter .72s cubic-bezier(.16,.85,.2,1) both;
  }
  #sidePanel,#cameraDock{
    font-family:"Didot Delivery","Noto Sans SC UI","Microsoft YaHei UI","PingFang SC","Source Han Sans SC",sans-serif;
    font-kerning:normal;
  }
  #sidePanel button,#sidePanel input,#cameraDock button{font-family:inherit;}
  #sidePanel .count-pill{font-family:"Didot Delivery",Didot,"Bodoni MT",serif;}
  .panel-card{
    position:relative;
    overflow:hidden;
    border:1px solid rgba(215,235,223,.12);
    border-radius:18px;
    background:linear-gradient(145deg,rgba(19,31,26,.84),rgba(8,15,12,.76));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 28px 78px rgba(0,0,0,.34);
    backdrop-filter:blur(18px);
  }
  .panel-card::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:linear-gradient(115deg,rgba(255,255,255,.045),transparent 22%,transparent 68%,rgba(118,185,0,.04));
  }
  .panel-card::after{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    right:-95px;
    top:-105px;
    pointer-events:none;
    border-radius:50%;
    background:radial-gradient(circle,rgba(118,185,0,.16),transparent 70%);
  }
  .panel-card>*{position:relative;z-index:1;}
  .drag-handle{background:rgba(215,235,223,.14);}
  .panel-header{align-items:flex-start;margin-bottom:16px;}
  .panel-title{
    display:flex;
    flex-direction:column;
    gap:0;
    color:#F2F4F1;
    font-family:"Didot Delivery",Didot,"Bodoni MT",serif;
    font-size:27px;
    font-style:normal;
    font-weight:700;
    letter-spacing:.015em;
    line-height:1;
  }
  .count-pill{
    border:1px solid rgba(118,185,0,.32);
    border-radius:999px;
    background:rgba(118,185,0,.14);
    color:#B9FF41;
    font-family:"Prism","Arial Narrow",Arial,sans-serif;
    font-size:15px;
    font-weight:400;
    letter-spacing:.04em;
  }

  .tabs{
    gap:8px;
    padding:3px;
    border:1px solid rgba(215,235,223,.08);
    border-radius:4px;
    background:rgba(7,13,10,.72);
  }
  .tab{
    border-radius:2px;
    color:var(--text-faint);
    font-size:16px;

  .btn{position:relative;overflow:hidden;border-radius:3px;}
  .btn::after{

  #toast{

  @keyframes brandEnter{

  @keyframes routeSignal{to{stroke-dashoffset:-18;}}

  /* ---------- Information hierarchy and restrained live motion ---------- */
  #systemRail{
    position:absolute;
    top:22px;
    right:32px;
    z-index:24;
    display:flex;
    align-items:stretch;
    gap:8px;
  }
  #systemRail #hintChip{
    position:static;
    min-height:36px;
    max-width:350px;
    padding:8px 13px;
    display:flex;
    align-items:center;
    transform:none;
    font-size:13px;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  #systemRail[data-state="connecting"] #hintChip::before{
    background:#E3A62F;
    box-shadow:0 0 12px rgba(227,166,47,.82);
  }
  #systemRail[data-state="offline"] #hintChip::before{
    background:#D85B46;
    box-shadow:0 0 12px rgba(216,91,70,.82);
  }
  #systemRail[data-state="online"] #hintChip::before{
    background:#76B900;
    box-shadow:0 0 12px rgba(118,185,0,.90);
  }

  #sidePanel{width:360px;bottom:auto;}
  .panel-card{padding:18px 18px 16px;}
  .queue-panel{
    display:flex;
    flex-direction:column;
    max-height:calc(100vh - 178px);
  }
  .queue-panel .drag-handle,
  .queue-panel .panel-header,
  .queue-panel .tabs,
  .queue-panel .panel-footer-slot{flex:none;}
  .queue-panel .order-list{
    flex:1 1 auto;
    min-height:0;
    max-height:none;
    overflow-y:auto;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    touch-action:pan-y;
    scrollbar-gutter:stable;
  }
  .queue-panel .order-card,.queue-panel .carpool-box{flex:0 0 auto;}
  .order-card:not(.order-card-active){padding:10px 12px;}
  .order-card:not(.order-card-active) .order-top{margin-bottom:4px;}
  .order-card:not(.order-card-active) .order-name{font-size:15px;margin-bottom:1px;}
  .order-card:not(.order-card-active) .order-route{font-size:13px;}
  .order-card:not(.order-card-active) .order-id{font-size:12px;}
  .order-card:not(.order-card-active) .badge{font-size:12px;padding:2px 7px;}
  .order-card-active{padding:14px 13px;}
  .order-card-active::after{display:none;}
  .order-card{cursor:pointer;outline:none;}
  .order-card:focus-visible{
    border-color:#B9FF41;
    box-shadow:0 0 0 2px rgba(185,255,65,.22),inset 0 1px 0 rgba(255,255,255,.035);
  }
  .order-card-focused{
    border-color:#B9FF41!important;
    background:linear-gradient(145deg,rgba(31,46,35,.96),rgba(12,21,15,.92));
    box-shadow:inset 3px 0 0 #B9FF41,0 12px 34px rgba(0,0,0,.28)!important;
    transform:translateY(-1px);
  }
  .order-card-new{animation:orderEnter .34s cubic-bezier(.2,.8,.2,1) both;}
  .order-card-exit{pointer-events:none;animation:orderExit .28s ease both;}
  .badge-changed{animation:badgeSwitch .38s cubic-bezier(.2,.8,.2,1) both;}

  #robotMarker{
    width:60px;
    height:60px;
    margin:-4px 0 0 -4px;
    cursor:pointer;
    pointer-events:auto;
    z-index:15;
    outline:none;
    isolation:isolate;
    transition:left .48s cubic-bezier(.2,.8,.2,1),top .48s cubic-bezier(.2,.8,.2,1),filter .22s ease,transform .22s ease;
  }
  #robotMarker:hover,#robotMarker:focus-visible{transform:translate(-50%,-50%) scale(1.08);}
  #robotMarker svg{width:60px;height:60px;position:relative;z-index:2;}
  #robotMarker svg{position:relative;z-index:2;}
  #robotMarker::before{
    content:"";
    position:absolute;
    inset:-5px;
    z-index:1;
    border:1px solid rgba(185,255,65,.46);
    border-radius:50%;
    pointer-events:none;
    animation:vehicleHalo 4.8s ease-out infinite;
  }
  #stage[data-connection="offline"] #robotMarker{filter:grayscale(1) opacity(.58);}
  #stage[data-connection="offline"] #robotMarker::before{border-color:rgba(216,91,70,.52);}

  #mapLayer{
    overflow:visible;
    border:1px solid rgba(215,235,223,.025);
    border-radius:32px;
    background:linear-gradient(145deg,rgba(12,24,19,.10),rgba(5,12,9,.025));
    box-shadow:none;
    transition:left .62s cubic-bezier(.2,.8,.2,1),top .62s cubic-bezier(.2,.8,.2,1),transform .62s cubic-bezier(.2,.8,.2,1);
  }
  #roadLayer{shape-rendering:geometricPrecision;}
  #roadLayer .road-base{stroke:rgba(2,7,4,.94);stroke-width:12;}
  #roadLayer .road-center{stroke:rgba(211,220,212,.24);stroke-width:3.2;}
  #routeSvg .route-track,#routeSvg .route-repositioning{stroke:rgba(118,185,0,.26);stroke-width:5;filter:none;}
  #routeSvg .route-segment-current{
    stroke:#A9EB36;
    stroke-width:6;
    stroke-dasharray:18 10;
    filter:drop-shadow(0 0 6px rgba(118,185,0,.34));
    animation:routeFlow 1.8s linear infinite;
  }
  #routeSvg .route-travelled{
    stroke:rgba(73,105,67,.88);
    stroke-width:8;
    stroke-dasharray:none;
    filter:none;
  }
  #routeSvg .route-focus{
    fill:none;
    stroke:#B9FF41;
    stroke-width:7;
    stroke-linecap:round;
    stroke-dasharray:18 10;
    filter:drop-shadow(0 0 8px rgba(118,185,0,.42));
    animation:routeFlow 1.8s linear infinite,focusRouteIn .45s ease both;
  }
  #routeSvg .route-preview{
    stroke:#E3A62F;
    stroke-width:5;
    filter:drop-shadow(0 0 5px rgba(227,166,47,.30));
  }
  #routeSvg .route-preview-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:routeDraw .72s cubic-bezier(.2,.75,.2,1) forwards;}

  .pin{outline:none;}
  button.pin{width:44px;height:44px;transform:translate(-50%,-50%);appearance:none;padding:0;border:0;background:none;color:inherit;font:inherit;}
  button.pin .pin-dot{left:50%;top:50%;}
  button.pin .pin-label{left:50%;top:calc(50% + 13px);}
  .pin::before{content:"";position:absolute;inset:0;border-radius:50%;}
  .pin-dot,.pin-label{transition:transform .18s ease,color .18s ease,background .18s ease,box-shadow .18s ease,opacity .18s ease;}
  .pin:hover .pin-dot,.pin:focus-visible .pin-dot{transform:translate(-50%,-50%) scale(1.22);}
  .pin:hover .pin-label,.pin:focus-visible .pin-label{color:#F1F3F0;transform:translate(-50%,0) scale(1.045);}
  .pin.is-order-focus .pin-dot{background:#76B900;border-color:#B9FF41;box-shadow:0 0 0 5px rgba(118,185,0,.14),0 0 15px rgba(118,185,0,.30);transform:translate(-50%,-50%) scale(1.18);}
  .pin.is-order-focus .pin-dot::after{background:#0B120E;box-shadow:none;}
  .pin.is-order-focus .pin-label{border-color:rgba(118,185,0,.18);background:rgba(8,16,11,.74);color:#F3F5F2;font-weight:700;}
  .stop-marker{pointer-events:auto;cursor:pointer;outline:none;}
  button.stop-marker{width:56px;height:56px;transform:translate(-50%,-50%);appearance:none;padding:0;border:0;background:none;color:inherit;font:inherit;}

  .stop-marker .stop-badge{transition:transform .2s ease,opacity .2s ease,filter .2s ease;}
  .stop-marker:hover .stop-badge,.stop-marker:focus-visible .stop-badge{transform:translate(-50%,-50%) scale(1.08);}
  .stop-marker.is-current-target .stop-badge{animation:targetBreathe 2.8s ease-in-out infinite;}
  .endpoint-tag{top:26px;padding:5px 9px;border:1px solid currentColor;border-radius:999px;background:rgba(8,14,10,.92);font-size:20px;}

  .queue-panel .empty-slogan{margin:2px 0 8px;font-size:16px;}
  .queue-panel .log-empty{padding:8px 6px 10px;font-size:13px;line-height:1.65;}

  #mapLegend{
    position:absolute;
    left:402px;
    bottom:24px;
    z-index:19;
    display:flex;
    align-items:center;
    gap:15px;
    padding:8px 10px;
    border:1px solid rgba(215,235,223,.09);
    border-radius:10px;
    background:rgba(8,15,12,.76);

  .legend-line{

  .legend-alert{background:#E3A62F;box-shadow:none;}
  .legend-done{background:rgba(73,105,67,.88);box-shadow:none;}

  /* ---------- Existing UDP camera stream entry ---------- */
  #cameraDock{
    position:absolute;
    left:32px;
    bottom:24px;
    z-index:42;
    width:360px;
  }
  .camera-toggle{
    width:100%;
    min-height:58px;
    padding:9px 11px;
    display:flex;
    align-items:center;
    gap:10px;
    border:1px solid rgba(215,235,223,.12);
    border-radius:14px;
    background:linear-gradient(145deg,rgba(19,31,26,.92),rgba(8,15,12,.88));
    color:#F1F3F0;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 16px 42px rgba(0,0,0,.26);
    backdrop-filter:blur(16px);
    cursor:pointer;
    transition:border-color .2s ease,background .2s ease,transform .2s ease;
  }
  .camera-toggle:hover,.camera-toggle:focus-visible{
    border-color:rgba(118,185,0,.46);
    background:linear-gradient(145deg,rgba(24,39,30,.96),rgba(9,18,13,.92));
    transform:translateY(-1px);

  }
  .camera-icon{
    width:36px;
    height:36px;
    flex:none;
    display:grid;
    place-items:center;
    border-radius:10px;
    background:rgba(118,185,0,.13);
    color:#A9EB36;
  }
  .camera-icon svg{width:20px;height:20px;stroke:currentColor;}
  .camera-copy{min-width:0;display:flex;flex:1;flex-direction:column;align-items:flex-start;gap:2px;}
  .camera-copy strong{font-size:14px;font-weight:700;letter-spacing:.02em;}
  .camera-copy small{max-width:190px;overflow:hidden;color:rgba(185,190,185,.54);font-size:10px;text-overflow:ellipsis;white-space:nowrap;}
  .camera-live-pill{
    padding:4px 7px;
    display:inline-flex;
    align-items:center;
    gap:5px;
    border:1px solid rgba(185,190,185,.14);
    border-radius:999px;
    color:#8E948F;
    font-family:"Prism","Arial Narrow",Arial,sans-serif;
    font-size:9px;
    letter-spacing:.08em;
  }
  .camera-live-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:#6D746E;}
  #cameraDock.has-frame .camera-live-pill{border-color:rgba(118,185,0,.34);color:#B9FF41;}
  #cameraDock.has-frame .camera-live-pill::before{background:#76B900;box-shadow:0 0 9px rgba(118,185,0,.86);animation:statusPulse 2.2s ease-in-out infinite;}
  .camera-viewer{
    position:absolute;
    left:calc(100% + 12px);
    bottom:0;
    width:420px;
    padding:10px;
    visibility:hidden;
    opacity:0;
    pointer-events:none;
    border:1px solid rgba(118,185,0,.24);
    border-radius:18px;
    background:linear-gradient(145deg,rgba(16,27,21,.98),rgba(5,11,8,.98));
    box-shadow:0 24px 72px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.035);
    transform:translateX(-8px) scale(.98);
    transform-origin:left bottom;
    transition:opacity .22s ease,transform .22s ease,visibility .22s ease;
  }
  #cameraDock.is-open .camera-viewer{visibility:visible;opacity:1;pointer-events:auto;transform:translateX(0) scale(1);}
  .camera-viewer-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 9px;}
  .camera-viewer-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;}
  .camera-viewer-title i{width:6px;height:6px;border-radius:50%;background:#76B900;box-shadow:0 0 8px rgba(118,185,0,.8);}
  .camera-close{width:26px;height:26px;border:0;border-radius:8px;background:transparent;color:#8E948F;font:inherit;font-size:18px;cursor:pointer;}
  .camera-close:hover{background:rgba(241,243,240,.06);color:#F1F3F0;}
  .camera-frame-shell{
    position:relative;
    aspect-ratio:16/9;
    display:grid;
    place-items:center;
    overflow:hidden;
    border:1px solid rgba(215,235,223,.10);
    border-radius:12px;
    background:#030705;
  }
  #cameraFrame{width:100%;height:100%;display:block;object-fit:cover;}
  #cameraFrame[hidden]{display:none;}
  #cameraEmpty{padding:18px;color:rgba(185,190,185,.50);font-size:12px;text-align:center;line-height:1.7;}

  .carpool-label>span{width:17px;height:17px;display:inline-flex;align-items:center;justify-content:center;}
  .carpool-label svg{width:17px;height:17px;stroke:currentColor;}

  /* ---------- Robot status popover ---------- */
  #robotPopover{

    visibility:hidden;
    opacity:0;
    pointer-events:none;
    border:1px solid rgba(185,255,65,.22);
    border-radius:12px;
    background:linear-gradient(145deg,rgba(20,29,23,.96),rgba(7,13,9,.96));
    box-shadow:0 20px 60px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.04);

  @keyframes cardSweepOnce{
    from{transform:translateX(-125%);opacity:.4;}
    to{transform:translateX(125%);opacity:0;}
  }
  @keyframes vehicleHalo{
    0%,58%{opacity:0;transform:scale(.82);}
    64%{opacity:.42;}

  }

  <script>
/* ============================================================
   清送 (QingSong) — Interactive Prototype Engine
   Combines V4 map geometry (4-block campus loop, 14 buildings)
   with V2 delivery-progress semantics + V3 floating-panel UI.
   ============================================================ */

/* ---------- 1. Map graph: junctions + 14 selectable buildings ----------
   Coordinates measured directly from THU_map_clean.png (the real campus
   road reference, 1440x816 photo — x kept 1:1, y scaled by 900/816≈1.103
   to fit this stage's 900px height). The 紫荆操场 spur is a real loop back
   down to the main edge (confirmed by thresholding the road-ink pixels and
   finding a continuous 3-sided rounded-rect bump, not a dead-end stub). */
/* Coordinates measured off THU_new_coords_overlay_3x.png (red ground-truth
   boxes, pixel-thresholded). x 1:1, y scaled by 900/816. Per live annotation
   feedback, 苏世民书院 and 'A' actually sit exactly AT their nearby junction
   (not just near it, like 图书馆/新清华学堂 do) — so those two junctions
   (formerly jSpineTop, j6) are merged directly into the sushimin/aBuild
   building nodes instead of being separate coincident points. */
const NODES = {
  // selectable buildings (id: {x,y,label, selectable:true})
  zijing:    { x: 803,  y: 30,  label: '紫荆操场',   selectable: true },
  like:      { x: 350,  y: 242, label: '理科楼',     selectable: true },
  library:   { x: 560,  y: 242, label: '图书馆',     selectable: true },
  sushimin:  { x: 801,  y: 242, label: '苏世民书院', selectable: true },
  dongda:    { x: 1050, y: 242, label: '东大操场',   selectable: true },
  hospital:  { x: 147,  y: 465, label: '校医院',     selectable: true },
  dorm:      { x: 801,  y: 465, label: '学生宿舍',   selectable: true },
  dongmen:   { x: 1269, y: 465, label: '东门',       selectable: true },
  hall:      { x: 555,  y: 662, label: '大礼堂',     selectable: true, home: true },
  xinqinghua:{ x: 801,  y: 662, label: '新清华学堂', selectable: true },
  zhongyang: { x: 1064, y: 662, label: '中央主楼',   selectable: true },
  aBuild:    { x: 1269, y: 662, label: 'A',          selectable: true },
  zhaolan:   { x: 740,  y: 870, label: '照澜院',     selectable: true },
  keji:      { x: 1004, y: 870, label: '科技大楼',   selectable: true },
  // junctions (routing only, not selectable / not drawn)
  j1:        { x: 147,  y: 242, label: '', selectable: false },
  jBumpL:    { x: 555,  y: 242, label: '', selectable: false },
  j3:        { x: 1269, y: 242, label: '', selectable: false },
  jBumpTL:   { x: 555,  y: 30,  label: '', selectable: false },
  jBumpTR:   { x: 1050, y: 30,  label: '', selectable: false },
  j4:        { x: 147,  y: 662, label: '', selectable: false },
  j7:        { x: 555,  y: 870, label: '', selectable: false },
  j8:        { x: 1269, y: 870, label: '', selectable: false },
};

const EDGES = [
  ['j1','like'],['like','library'],['library','jBumpL'],
  ['jBumpL','sushimin'],
  ['sushimin','dongda'],['dongda','j3'],
  ['jBumpL','jBumpTL'],['jBumpTL','zijing'],['zijing','jBumpTR'],['jBumpTR','dongda'],
  ['j1','hospital'],['hospital','j4'],
  ['sushimin','dorm'],['dorm','xinqinghua'],
  ['j3','dongmen'],['dongmen','aBuild'],
  ['j4','hall'],['hall','xinqinghua'],['xinqinghua','zhongyang'],['zhongyang','aBuild'],
  ['aBuild','j8'],
  ['hall','j7'],['j7','zhaolan'],['zhaolan','keji'],['keji','j8'],
];

const dist = (a,b) => Math.hypot(NODES[a].x-NODES[b].x, NODES[a].y-NODES[b].y);

const ADJ = {};
Object.keys(NODES).forEach(k => ADJ[k] = []);
EDGES.forEach(([a,b]) => {
  const d = dist(a,b);
  ADJ[a].push({to:b, d}); ADJ[b].push({to:a, d});
});

function shortestPath(start, end) {
  const distMap = {}, prev = {}, visited = new Set();
  Object.keys(NODES).forEach(k => distMap[k] = Infinity);
  distMap[start] = 0;
  const pq = new Set(Object.keys(NODES));
  while (pq.size) {
    let u = null, best = Infinity;
    pq.forEach(k => { if (distMap[k] < best) { best = distMap[k]; u = k; } });
    if (u === null) break;
    pq.delete(u); visited.add(u);
    if (u === end) break;
    ADJ[u].forEach(({to, d}) => {
      if (visited.has(to)) return;
      const nd = distMap[u] + d;
      if (nd < distMap[to]) { distMap[to] = nd; prev[to] = u; }
    });
  }
  const path = [end];
  let cur = end;
  while (cur !== start) {
    cur = prev[cur];
    if (cur === undefined) return [start, end]; // fallback, shouldn't happen
    path.unshift(cur);
  }
  return path;
}

const ROUTE_CORNER_R = 38;

// Dense, already-corner-rounded point list — this is the single source of
// truth for both the drawn route AND the robot's animated position, so the
// robot marker can never drift off the visible (rounded) line at a turn.
function pathPoints(start, end) {
  const raw = shortestPath(start, end).map(id => ({x: NODES[id].x, y: NODES[id].y}));
  return roundedPoints(raw, ROUTE_CORNER_R);
}

function etaInfo(from, to) {
  const pts = pathPoints(from, to);
  const distM = Math.round(pathLength(pts) * 1.2 / 10) * 10;
  const travelMin = Math.max(1, Math.round(distM / 45));
  const queueAhead = totalOpen();
  const waitMin = Math.round(queueAhead * 2.5);
  return { distM, travelMin, waitMin, totalMin: travelMin + waitMin, queueAhead };
}

function pathLength(pts) {
  let total = 0;
  for (let i=1;i<pts.length;i++) total += Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y);
  return total;
}

function pointAtFraction(pts, frac) {
  const total = pathLength(pts);
  let target = total * Math.max(0, Math.min(1, frac));
  for (let i=1;i<pts.length;i++) {
    const segLen = Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y);
    if (target <= segLen || i === pts.length-1) {
      const t = segLen === 0 ? 0 : target/segLen;
      return {
        x: pts[i-1].x + (pts[i].x-pts[i-1].x) * t,
        y: pts[i-1].y + (pts[i].y-pts[i-1].y) * t,
      };
    }
    target -= segLen;
  }
  return pts[pts.length-1];
}

/* rounded-corner SVG path from an ordered point list (arc radius r) */
function quadPoint(a, c, b, t) {
  const mt = 1 - t;
  return { x: mt*mt*a.x + 2*mt*t*c.x + t*t*b.x, y: mt*mt*a.y + 2*mt*t*c.y + t*t*b.y };
}

// Resamples a sharp-corner polyline into a dense point list where each
// interior corner is replaced by a rounded (quadratic-bezier) arc of
// radius r. Used as the SINGLE geometry both the visible route and the
// robot's animated position are derived from, so they can never diverge.
function roundedPoints(pts, r, steps = 8) {
  if (pts.length < 3) return pts.slice();
  const out = [pts[0]];
  for (let i=1;i<pts.length-1;i++) {
    const prev = pts[i-1], p = pts[i], next = pts[i+1];
    const segInLen = Math.hypot(p.x-prev.x, p.y-prev.y);
    const segOutLen = Math.hypot(next.x-p.x, next.y-p.y);
    const rr = Math.min(r, segInLen/2, segOutLen/2);
    const inPt = { x: p.x - (p.x-prev.x)/segInLen*rr, y: p.y - (p.y-prev.y)/segInLen*rr };
    const outPt = { x: p.x + (next.x-p.x)/segOutLen*rr, y: p.y + (next.y-p.y)/segOutLen*rr };
    out.push(inPt);
    for (let s=1;s<steps;s++) out.push(quadPoint(inPt, p, outPt, s/steps));
    out.push(outPt);
  }
  out.push(pts[pts.length-1]);
  return out;
}

// Same rounding as roundedPoints, but also returns which output-array index
// each ORIGINAL waypoint landed on. Progress fractions must be measured
// against this same resampled array's own length, or a fraction computed
// from the raw (sharp-corner, longer) distances will overshoot the shorter
// rounded curve at every corner, making the robot marker visibly leap ahead
// each time it turns.
function roundedPointsWithBreaks(pts, r, steps = 8) {
  if (pts.length < 3) {
    const flat = pts.slice();
    return { points: flat, breakIndices: flat.map((_, i) => i) };
  }
  const out = [pts[0]];
  const breakIndices = [0];
  for (let i=1;i<pts.length-1;i++) {
    const prev = pts[i-1], p = pts[i], next = pts[i+1];
    const segInLen = Math.hypot(p.x-prev.x, p.y-prev.y);
    const segOutLen = Math.hypot(next.x-p.x, next.y-p.y);
    const rr = Math.min(r, segInLen/2, segOutLen/2);
    const inPt = { x: p.x - (p.x-prev.x)/segInLen*rr, y: p.y - (p.y-prev.y)/segInLen*rr };
    const outPt = { x: p.x + (next.x-p.x)/segOutLen*rr, y: p.y + (next.y-p.y)/segOutLen*rr };
    out.push(inPt);
    for (let s=1;s<steps;s++) out.push(quadPoint(inPt, p, outPt, s/steps));
    out.push(outPt);
    breakIndices.push(out.length - 1);
  }
  out.push(pts[pts.length-1]);
  breakIndices.push(out.length - 1);
  return { points: out, breakIndices };
}

function pointsToPathD(pts) {
  if (pts.length < 2) return '';
  return `M ${pts[0].x} ${pts[0].y} ` + pts.slice(1).map(p => `L ${p.x} ${p.y}`).join(' ');
}

// For raw/sharp-corner inputs (the static road network) — rounds, then stringifies.
function roundedPathD(pts, r) {
  return pointsToPathD(roundedPoints(pts, r));
}

/* ---------- 2. Order model & state ---------- */
const ORDER_COLORS = ['#5292FF','#FF8787','#3DDCA6','#FFC94D','#B98BFF','#5DD8FF'];

// shared from/to glyphs — used by the ft-card icon and the map endpoint marker
const ICON_FROM = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="9" width="16" height="11" rx="1.5"/><path d="M4 9l8-5 8 5"/></svg>';
const ICON_TO = '<svg viewBox="0 0 24 24" width="13" height="13" fill="#fff"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';
const ICON_CHECK = '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';
// Open-box glyphs for the loading/unloading wait states — arrow direction
// (into vs. out of the box) is the only visual difference between the two.
const ICON_LOAD = '<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l4-6M20 10l-4-6" stroke="#fff" stroke-width="1.6"/><path d="M4 10h16v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V10z" stroke="#fff" stroke-width="1.6"/><path d="M12 4v8M9 9l3 3 3-3" stroke="#3DDCA6" stroke-width="2"/></svg>';
const ICON_UNLOAD = '<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l4-6M20 10l-4-6" stroke="#fff" stroke-width="1.6"/><path d="M4 10h16v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V10z" stroke="#fff" stroke-width="1.6"/><path d="M12 20v-8M9 15l3-3 3 3" stroke="#3DDCA6" stroke-width="2"/></svg>';
const NAME_POOL = ['林晓','苏晴','黄磊','吴悠','郑凯','孙艺','王小明','陈可','周雨薇','赵航','李芸','马斌','高远','谢婷'];
let nameCursor = 0, orderSeq = 42;
function peekName() { return NAME_POOL[nameCursor % NAME_POOL.length]; }
const MAX_SLOTS = 5;
// UI/index.html's SPEED=45 was calibrated for its own graph's typical route
// lengths; V4's graph has longer point-to-point distances (e.g. no direct
// hall<->library edge — the real road doesn't have one), so the literal same
// number made routine trips take 30+ seconds. Recalibrated so a typical run
// still takes a brisk few seconds, keeping the same distance-proportional
// duration model.
const RUN_SPEED = 90; // 1440-space units / second

const state = {
  orders: [],
  tab: 'active',           // 'active' | 'all'
  selecting: null,         // null | {from:nodeId|null, to:nodeId|null}
  focusedOrderId: null,    // presentation-only map/order linkage
  robotPos: 'hall',        // node id the robot is physically resting at when idle
  run: null,               // null | {orderIds, rawPath, points, breakLen, totalLen, startTime, duration, t}
};

const seenOrderIds = new Set();
const lastOrderStatuses = new Map();

function seedOrders() {
  state.orders = [];
  state.run = null;
  state.robotPos = 'hall';
}

/* ---------- 3. Derived helpers ---------- */
function activeCount() { return state.orders.filter(o => o.status === '配送中').length; }
function totalOpen() { return state.orders.filter(o => o.status !== '已送达').length; }

/* ---------- Robot dispatch engine — ported from UI/index.html: a single
   continuous "run" the robot drives (robotPos -> stop -> stop -> ...),
   with real pooling (a new order joins the CURRENT run if both its pickup
   and dropoff already lie ahead on that run's path) instead of the earlier
   per-order simulation. See UI/index.html's tryPoolOrStartOrder/startNextRun/
   animateRun for the reference implementation this mirrors. ---------- */
function buildRun(waypointIds) {
  let rawPath = [waypointIds[0]];
  for (let i = 0; i < waypointIds.length - 1; i++) {
    rawPath = rawPath.concat(shortestPath(waypointIds[i], waypointIds[i+1]).slice(1));
  }
  const rawCoords = rawPath.map(id => NODES[id]);
  const { points, breakIndices } = roundedPointsWithBreaks(rawCoords, ROUTE_CORNER_R);
  const breakLen = breakIndices.map((index) => pathLength(points.slice(0, index + 1)));
  return { rawPath, points, breakLen, totalLen: breakLen[breakLen.length-1] };
}

function currentProgressIdx() {
  if (!state.run) return 0;
  const curLen = (state.run.t || 0) * state.run.totalLen;
  const bl = state.run.breakLen;
  let idx = 0;
  for (let i = 0; i < bl.length; i++) { if (bl[i] <= curLen) idx = i; else break; }
  return idx;
}

// A confirmed order either joins the robot's current run (if it's genuinely
// on the way — both stops already lie ahead on the run's path) or waits.
// Returns true if the order joined the current run (pooled), false otherwise.
function tryPoolOrStartOrder(order) {
  if (state.run) {
    const run = state.run;
    const fromIdx = run.rawPath.indexOf(order.from);
    const toIdx = run.rawPath.indexOf(order.to);
    const progressIdx = currentProgressIdx();
    if (fromIdx !== -1 && toIdx !== -1 && fromIdx >= progressIdx && toIdx > fromIdx) {
      run.orderIds.push(order.id);
      order.status = '配送中';
      order.phase = 'to_pickup';
      const primary = state.orders.find(o => o.id === run.orderIds[0]);
      if (!primary.groupId) primary.groupId = 'grp' + primary.id;
      order.groupId = primary.groupId;
      renderSvgOverlay();
      if (!state.selecting) updateQueuePanelLive();
      return true;
    }
    return false; // not on the way — stays 排队中 until the current run finishes
  }
  startNextRun();
  return false;
}

function startNextRun() {
  if (state.run) return;
  const next = state.orders.find(o => o.status === '排队中');
  if (!next) return;
  const built = buildRun([state.robotPos, next.from, next.to]);
  next.status = '配送中';
  next.phase = 'to_pickup';
  state.run = Object.assign(built, {
    orderIds: [next.id],
    startTime: performance.now(),
    duration: Math.max(1800, (built.totalLen / RUN_SPEED) * 1000),
    t: 0,
  });
  renderSvgOverlay();
  if (!state.selecting) updateQueuePanelLive();
  requestAnimationFrame(animateRun);
}

function orderProgressPercent(o) {
  if (!state.run || o.phase !== 'in_transit') return 0;
  const run = state.run;
  const fromIdx = run.rawPath.indexOf(o.from), toIdx = run.rawPath.indexOf(o.to);
  const segStart = run.breakLen[fromIdx], segEnd = run.breakLen[toIdx];
  if (segEnd <= segStart) return 100;
  const curLen = run.t * run.totalLen;
  return Math.max(0, Math.min(100, (curLen - segStart) / (segEnd - segStart) * 100));
}

function animateRun(now) {
  const run = state.run;
  if (!run) return;
  const t = Math.min(1, (now - run.startTime) / run.duration);
  run.t = t;
  const progressIdx = currentProgressIdx();

  let statusChanged = false;
  run.orderIds.forEach(oid => {
    const o = state.orders.find(x => x.id === oid);
    if (!o) return;
    const fromIdx = run.rawPath.indexOf(o.from), toIdx = run.rawPath.indexOf(o.to);
    if (o.phase === 'to_pickup' && progressIdx >= fromIdx) { o.phase = 'in_transit'; statusChanged = true; }
    if (o.phase === 'in_transit' && progressIdx >= toIdx) {
      o.status = '已送达'; o.phase = null; statusChanged = true;
      showToast(`订单 #0${o.id} 已送达 ${NODES[o.to].label}`);
    }
  });

  renderSvgOverlay();
  if (statusChanged && !state.selecting) updateQueuePanelLive();

  if (t < 1) {
    requestAnimationFrame(animateRun);
  } else {
    run.orderIds.forEach(oid => {
      const o = state.orders.find(x => x.id === oid);
      if (o && o.status !== '已送达') {
        o.status = '已送达'; o.phase = null;
        showToast(`订单 #0${o.id} 已送达 ${NODES[o.to].label}`);
      }
    });
    state.robotPos = run.rawPath[run.rawPath.length-1];
    state.run = null;
    renderSvgOverlay();
    if (!state.selecting) updateQueuePanelLive();
    setTimeout(startNextRun, 400);
  }
}

/* ---------- 7. Rendering: route / selection overlay ---------- */
function renderSvgOverlay() {
  const svg = document.getElementById('routeSvg');
  let markup = '';

  const run = state.run;
  if (run) {
    markup += `<path d="${pointsToPathD(run.points)}" class="route-track" />`;
    const travelPts = tracePartial(run.points, run.t);
    if (travelPts.length > 1) markup += `<path d="${pointsToPathD(travelPts)}" class="route-travelled" />`;
  }

  // selection preview (from/to picking) — pathPoints() is already rounded
  if (state.selecting && state.selecting.from && state.selecting.to) {
    const pts = pathPoints(state.selecting.from, state.selecting.to);
    markup += `<path d="${pointsToPathD(pts)}" pathLength="1" class="route-preview route-preview-draw" />`;
  }

  svg.innerHTML = markup;

  // robot marker position — always on a real lane point, never teleported
  const robotEl = document.getElementById('robotMarker');
  if (run) {
    const p = pointAtFraction(run.points, run.t);
    robotEl.style.left = p.x + 'px';
    robotEl.style.top = p.y + 'px';
  } else {
    const rest = NODES[state.robotPos] || NODES.hall;
    robotEl.style.left = rest.x + 'px';
    robotEl.style.top = rest.y + 'px';
  }
  robotEl.style.opacity = 1;

  // from/to connector markers during selection, or numbered stops along the
  // robot's current run (every pending pickup/dropoff of every pooled order,
  // in the order the robot will actually reach them)
  const markerLayer = document.getElementById('markerLayer');
  markerLayer.innerHTML = '';
  if (state.selecting) {
    if (state.selecting.from) markerLayer.appendChild(buildEndpointMarker(state.selecting.from, 'from'));
    if (state.selecting.to) markerLayer.appendChild(buildEndpointMarker(state.selecting.to, 'to'));
  } else if (run) {
    const stops = [];
    run.orderIds.forEach(oid => {
      const o = state.orders.find(x => x.id === oid);
      if (!o || o.status === '已送达') return;
      const fromIdx = run.rawPath.indexOf(o.from), toIdx = run.rawPath.indexOf(o.to);
      if (o.phase === 'to_pickup') stops.push({ idx: fromIdx, nodeId: o.from, color: o.color });
      stops.push({ idx: toIdx, nodeId: o.to, color: o.color });
    });
    stops.sort((a,b) => a.idx - b.idx);
    stops.forEach((s,i) => markerLayer.appendChild(buildStopMarker(s.nodeId, i+1, s.color)));
  }
}

function buildStopMarker(nodeId, num, color, iconMode) {
  const n = NODES[nodeId];
  const el = document.createElement('button');
  el.className = 'stop-marker';
  el.type = 'button';
  el.dataset.node = nodeId;
  el.style.left = n.x + 'px';
  el.style.top = n.y + 'px';
  const content = iconMode === 'load' ? ICON_LOAD : iconMode === 'unload' ? ICON_UNLOAD : num;
  // Load/unload icons are always white-outline + teal arrow, so the badge
  // itself must stay a fixed color here — an order's own assigned color can
  // land on the exact same teal, making the arrow invisible against it.
  const badgeColor = iconMode ? 'var(--blue)' : (color || 'var(--blue)');
  el.innerHTML = `<div class="stop-badge" style="background:${badgeColor}">${content}</div>`;
  return el;
}

function tracePartial(pts, frac) {
  const total = pathLength(pts);
  let target = total * Math.max(0, Math.min(1, frac));
  const out = [pts[0]];
  for (let i=1;i<pts.length;i++) {
    const segLen = Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y);
    if (target <= segLen) {
      const t = segLen === 0 ? 0 : target/segLen;
      out.push({ x: pts[i-1].x + (pts[i].x-pts[i-1].x)*t, y: pts[i-1].y + (pts[i].y-pts[i-1].y)*t });
      return out;
    }
    out.push(pts[i]);
    target -= segLen;
  }
  return out;
}

function buildEndpointMarker(nodeId, kind) {
  const n = NODES[nodeId];
  const el = document.createElement('div');
  el.className = 'endpoint-marker endpoint-' + kind;
  el.style.left = n.x + 'px';
  el.style.top = n.y + 'px';
  const icon = kind === 'from' ? ICON_FROM : ICON_TO;
  const stepLabel = kind === 'from' ? '① Pickup' : '② Drop-off';
  el.innerHTML = `
    <div class="endpoint-badge endpoint-badge-${kind}">${icon}</div>
    <div class="endpoint-tag tag-${kind}">${stepLabel} · ${n.label}</div>`;
  return el;
}

/* ---------- 8. Rendering: side panel ---------- */
function renderPanel() {
  const panel = document.getElementById('sidePanel');
  const previousCard = panel.querySelector('.panel-card');
  const previousPanelScrollTop = previousCard ? previousCard.scrollTop : 0;
  const previousList = panel.querySelector('.order-list');
  const previousScrollTop = previousList ? previousList.scrollTop : 0;
  const visibleIds = new Set(state.orders
    .filter(o => state.tab === 'all' || o.status !== '已送达')
    .map(o => String(o.id)));
  const exitingCards = previousList ? [...previousList.querySelectorAll('.order-card[data-order]')]
    .filter(card => !visibleIds.has(String(card.dataset.order)))
    .map(card => card.cloneNode(true)) : [];
  if (state.selecting) {
    panel.innerHTML = selectionPanelHTML();
    wireSelectionPanel();
    const nextCard = panel.querySelector('.panel-card');
    if (nextCard) nextCard.scrollTop = previousPanelScrollTop;
    document.getElementById('hintChip').textContent = hintText();
  } else {
    panel.innerHTML = queuePanelHTML();
    wireQueuePanel();
    const nextList = panel.querySelector('.order-list');
    if (nextList) {
      nextList.scrollTop = previousScrollTop;
      exitingCards.forEach(card => {
        card.classList.remove('order-card-new','order-card-focused');
        card.classList.add('order-card-exit');
        nextList.appendChild(card);
        setTimeout(() => card.remove(), 320);

    document.getElementById('hintChip').textContent = '点选地图上的建筑，选择取件与送达地点';
  }
}

        </div>

        <div class="ft-row">

        </div>

      ${ ready ? '' : `<div class="status-line">${hintText()}</div>` }

}

function wireSelectionPanel() {
  const closeBtn = document.getElementById('closeSelBtn');
  if (closeBtn) closeBtn.addEventListener('click', cancelSelection);
  const swapBtn = document.getElementById('swapBtnSel');
  if (swapBtn) swapBtn.addEventListener('click', swapSelection);
  const nameInput = document.getElementById('nameInput');
  if (nameInput) nameInput.addEventListener('input', () => { state.selecting.name = nameInput.value; });
  const confirmBtn = document.getElementById('confirmSelBtn');
  if (confirmBtn) confirmBtn.addEventListener('click', confirmSelection);

function swapSelection() {
  const s = state.selecting;
  [s.from, s.to] = [s.to, s.from];
  refreshPinVisuals();
  renderSvgOverlay();
  renderPanel();
}

function displayOrderStatus(order) {
  const value = order && (order.statusLabel || order.status);
  return ({
    '排队中':'Queued',
    '前往取件':'To Pickup',
    '等待装载':'Awaiting Load',
    '配送中':'En Route',
    '正在配送':'En Route',
    '即将到达':'Arriving',
    '等待取件':'Awaiting Collection',
    '等待卸货':'Awaiting Collection',
    '已送达':'Delivered',
    '已完成':'Completed',
    '处理中':'Processing'
  })[value] || value || 'Processing';
}

function buildQueueBody() {
  const list = state.orders.filter(o => state.tab === 'all' ? true : o.status !== '已送达');
  const overflow = state.orders.filter(o => o.status === '排队中').length;

  let bodyHTML = '';
  if (list.length === 0) {
    bodyHTML = `
      <div class="empty-slogan">Ready when you are</div>
      <div class="log-empty">
        ${state.tab === 'all'
          ? 'No delivery history yet'
          : 'No active deliveries<br>Select pickup and drop-off to begin'}
      </div>`;
  } else {
    // group orders genuinely riding together in the same run (real pooling,
    // not just a coincidental shared destination)
    const rendered = new Set();
    list.slice().sort(orderSort).forEach(o => {
      if (rendered.has(o.id)) return;
      const groupMembers = o.groupId ? list.filter(x => x.groupId === o.groupId) : [];
      if (groupMembers.length >= 2 && state.tab !== 'all') {
        bodyHTML += carpoolGroupHTML(groupMembers);
        groupMembers.forEach(m => rendered.add(m.id));
      } else {
        bodyHTML += orderCardHTML(o);
        rendered.add(o.id);
      }
    });
  }

  let footerHTML = '';
  if (list.length) {
    if (state.tab === 'all') {
      const doneCount = state.orders.filter(o => o.status === '已送达').length;
      footerHTML = `<div class="panel-footer">${state.orders.length} total · ${doneCount} delivered</div>`;
    } else {
      footerHTML = overflow > 0
        ? `<div class="panel-footer">${overflow} queued</div>`
        : '';
    }
  }

  return { bodyHTML, footerHTML };
}

function queuePanelHTML() {
  const { bodyHTML, footerHTML } = buildQueueBody();
  return `
    <div class="panel-card queue-panel">
      <div class="drag-handle"></div>
      <div class="panel-header">
        <div class="panel-title">Delivery Queue</div>
        <div class="count-pill">${totalOpen()} OPEN</div>
      </div>
      <div class="tabs">
        <button class="tab ${state.tab==='active'?'tab-active':''}" data-tab="active">Active</button>
        <button class="tab ${state.tab==='all'?'tab-active':''}" data-tab="all">All</button>
      </div>
      <div class="order-list">${bodyHTML}</div>
      <div class="panel-footer-slot">${footerHTML}</div>
    </div>`;
}

function updateQueuePanelLive() {
  const card = document.querySelector('#sidePanel .panel-card');
  if (!card || !card.querySelector('.tabs')) { renderPanel(); return; }
  const { bodyHTML, footerHTML } = buildQueueBody();
  const countEl = card.querySelector('.count-pill');
  if (countEl) countEl.textContent = `${totalOpen()} OPEN`;
  const listEl = card.querySelector('.order-list');
  if (listEl) listEl.innerHTML = bodyHTML;
  const footerSlot = card.querySelector('.panel-footer-slot');
  if (footerSlot) footerSlot.innerHTML = footerHTML;
  markOrderVisualState();
}

function orderSort(a,b) {
  const rank = {'配送中':0,'排队中':1,'已送达':2};
  return (rank[a.status]-rank[b.status]) || (a.id-b.id);
}

function statusBadgeClass(status) {
  return { '配送中':'badge-active','排队中':'badge-queued','已送达':'badge-done' }[status];
}

function orderCardVisualClass(order) {
  const classes = [];
  if (String(state.focusedOrderId) === String(order.id)) classes.push('order-card-focused');
  if (!seenOrderIds.has(String(order.id))) classes.push('order-card-new');
  return classes.join(' ');
}

function orderCardAriaLabel(order) {
  return String(state.focusedOrderId) === String(order.id)
    ? `取消聚焦订单 #0${order.id}`
    : `在地图上聚焦订单 #0${order.id}`;
}

function orderBadgeVisualClass(order) {
  const previous = lastOrderStatuses.get(String(order.id));
  const current = displayOrderStatus(order);
  return previous && previous !== current ? 'badge-changed' : '';
}

function markOrderVisualState() {
  state.orders.forEach(order => {
    seenOrderIds.add(String(order.id));
    lastOrderStatuses.set(String(order.id),displayOrderStatus(order));
  });
}

function orderCardHTML(o) {
  const isActive = o.status === '配送中';
  const isDone = o.status === '已送达';
  const badgeLabel = isDone ? '✓ Delivered' : displayOrderStatus(o);
  return `
    <div class="order-card ${isActive?'order-card-active':''} ${orderCardVisualClass(o)}" data-order="${o.id}" role="button" tabindex="0" aria-label="${orderCardAriaLabel(o)}">
      <div class="order-top">
        <div class="order-id">#0${o.id} · ${o.ts ? tsLabel(o.ts) : ''}</div>
        <div class="badge ${statusBadgeClass(o.status)} ${orderBadgeVisualClass(o)}">${badgeLabel}</div>
      </div>
      <div class="order-name">${o.name}</div>
      <div class="order-route">${NODES[o.from].label} → ${NODES[o.to].label}</div>
      ${ isActive ? `<div class="progress-track"><div class="progress-fill" style="width:${orderProgressPercent(o)}%"></div></div>` : '' }
    </div>`;
}

function carpoolGroupHTML(members) {
  return `
    <div class="carpool-box">
      <div class="carpool-label"><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M5 16h14l-1.5-5.5a2 2 0 0 0-1.9-1.5H8.4a2 2 0 0 0-1.9 1.5L5 16Z" stroke-width="1.8"/><path d="M3.5 16v3M20.5 16v3M7 19h10M8 13h8" stroke-width="1.8" stroke-linecap="round"/><circle cx="7" cy="17" r="1.2" fill="currentColor" stroke="none"/><circle cx="17" cy="17" r="1.2" fill="currentColor" stroke="none"/></svg></span> Pooled · ${members.length} orders share this route</div>
      ${members.map(m => `
        <div class="order-card order-card-sub ${orderCardVisualClass(m)}" data-order="${m.id}" role="button" tabindex="0" aria-label="${orderCardAriaLabel(m)}">
          <div class="order-top">
            <div class="order-id">#0${m.id} · ${tsLabel(m.ts)}</div>
            <div class="badge ${statusBadgeClass(m.status)} ${orderBadgeVisualClass(m)}">${displayOrderStatus(m)}</div>
          </div>
          <div class="order-name">${m.name}</div>
          <div class="order-route">${NODES[m.from].label} → ${NODES[m.to].label}</div>

function tsLabel(ts) {
  const d = new Date(ts);
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  return `${hh}:${mm}`;
}

function wireQueuePanel() {
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => { state.tab = t.dataset.tab; renderPanel(); });
  });
}

function focusedOrder() {
  return state.orders.find(order => String(order.id) === String(state.focusedOrderId)) || null;
}

function clearOrderFocus() {
  state.focusedOrderId = null;
  renderSvgOverlay();
  renderPanel();
  enhanceMapPresentation();
  layoutMap();
}

function focusOrder(orderId, allowToggle = true) {
  const order = state.orders.find(item => String(item.id) === String(orderId));
  if (!order) return;
  if (allowToggle && String(state.focusedOrderId) === String(order.id)) {
    clearOrderFocus();
    return;
  }
  state.focusedOrderId = order.id;
  state.selecting = null;
  clearPinStates();
  renderSvgOverlay();
  renderPanel();
  enhanceMapPresentation();
  layoutMap();
}

function currentSnapshotOrder() {
  const snapshot = window.deliveryBackendAdapter?.snapshot;
  if (!snapshot || !Array.isArray(snapshot.orders)) return null;
  const raw = snapshot.orders.find(order => order.order_id === snapshot.current_order_id);
  return raw ? state.orders.find(order => order.serverOrderId === raw.order_id) || null : null;
}

function orderForRouteNode(nodeId) {
  const candidates = state.orders.filter(order => order.status !== '已送达' && (order.from === nodeId || order.to === nodeId));
  return candidates.find(order => String(order.id) === String(state.focusedOrderId))
    || candidates.find(order => order.serverOrderId === window.deliveryBackendAdapter?.snapshot?.current_order_id)
    || candidates[0]
    || null;
}

function uiNodeFromServer(nodeId) {
  const label = PRESENTATION_NODE_LABELS[Number(nodeId)];
  return Object.keys(NODES).find(id => NODES[id].label === label) || null;
}

function toggleRobotPopover(forceOpen) {
  const popover = document.getElementById('robotPopover');
  const robot = document.getElementById('robotMarker');
  const shouldOpen = typeof forceOpen === 'boolean' ? forceOpen : !popover.classList.contains('is-open');
  if (shouldOpen) {
    popover.classList.add('is-open');
    robot.setAttribute('aria-expanded','true');
    const order = currentSnapshotOrder() || focusedOrder() || state.orders.find(item => item.status === '配送中');
    if (order) focusOrder(order.id,false);
    updateRobotPopover();
    positionRobotPopover();
  } else {
    popover.classList.remove('is-open');
    robot.setAttribute('aria-expanded','false');
  }
}

function positionRobotPopover() {
  const popover = document.getElementById('robotPopover');
  const robot = document.getElementById('robotMarker');
  if (!popover.classList.contains('is-open') && popover.style.left) return;
  const rect = robot.getBoundingClientRect();
  const width = popover.offsetWidth || 238;
  const height = popover.offsetHeight || 152;
  let left = rect.right + 12;
  if (left + width > window.innerWidth - 12) left = rect.left - width - 12;
  let top = rect.top - 8;
  top = Math.max(92,Math.min(top,window.innerHeight - height - 16));
  popover.style.left = `${Math.max(12,left)}px`;
  popover.style.top = `${top}px`;
}

function updateRobotPopover() {
  const snapshot = window.deliveryBackendAdapter?.snapshot;
  const order = currentSnapshotOrder() || focusedOrder() || state.orders.find(item => item.status === '配送中');
  const status = order ? (order.statusLabel || order.status) : '静止待命';
  let progress = order ? Math.max(0,Math.min(100,Number(orderProgressPercent(order)) || 0)) : 0;
  const orderStops = order && Array.isArray(snapshot?.active_trip?.stops)
    ? snapshot.active_trip.stops.filter(stop => (stop.operations || []).some(operation => operation.order_id === order.serverOrderId))
    : [];
  if (order && order.status !== '已送达' && orderStops.length) {
    const completed = orderStops.filter(stop => stop.state === 'COMPLETED').length;
    const reachedCurrent = orderStops.some(stop => stop.state === 'WAITING_CONFIRM') ? 1 : progress / 100;
    progress = Math.min(96,((completed + reachedCurrent) / orderStops.length) * 100);
  }
  const nextNode = snapshot?.navigation_progress?.next_node;
  document.getElementById('robotTaskLabel').textContent = order
    ? `#0${order.id} ${order.name} · ${NODES[order.from].label} → ${NODES[order.to].label}`
    : '当前无执行任务';
  document.getElementById('robotNextStop').textContent = nextNode != null
    ? presentationNodeLabel(nextNode)
    : (order ? NODES[order.to].label : '等待调度');
  document.getElementById('robotEtaStatus').textContent = status;
  document.getElementById('robotProgressLabel').textContent = `${Math.round(progress)}%`;
  document.getElementById('robotProgressFill').style.width = `${progress}%`;
}

let lastPreviewDrawKey = '';
function enhanceMapPresentation() {
  const adapter = window.deliveryBackendAdapter;
  const svg = document.getElementById('routeSvg');
  if (!svg) return;

  const routePaths = [...svg.querySelectorAll('path.route-track,path.route-repositioning')];
  routePaths.forEach(path => path.classList.remove('route-segment-current'));
  if (adapter?.routeVisuals) {
    adapter.routeVisuals.forEach((leg,index) => {
      if (leg.is_current && routePaths[index]) routePaths[index].classList.add('route-segment-current');
    });
  } else if (state.run && routePaths[0]) {
    routePaths[0].classList.add('route-segment-current');
  }

  const preview = svg.querySelector('.route-preview');
  const previewKey = state.selecting?.from && state.selecting?.to ? `${state.selecting.from}:${state.selecting.to}` : '';
  if (preview && previewKey && previewKey !== lastPreviewDrawKey) {
    preview.setAttribute('pathLength','1');
    preview.classList.add('route-preview-draw');
    lastPreviewDrawKey = previewKey;
  }
  if (!previewKey) lastPreviewDrawKey = '';

  const order = focusedOrder();
  if (order && !state.selecting && !svg.querySelector(`.route-focus[data-order="${order.id}"]`)) {
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',pointsToPathD(pathPoints(order.from,order.to)));
    path.setAttribute('class','route-focus');
    path.dataset.order = order.id;
    svg.appendChild(path);
  }

  document.querySelectorAll('.pin').forEach(pin => {
    const isFocus = Boolean(order && (pin.dataset.node === order.from || pin.dataset.node === order.to));
    pin.classList.toggle('is-order-focus',isFocus);
  });
  const targetServerNode = adapter?.snapshot?.navigation_progress?.next_node
    ?? adapter?.snapshot?.route_plan?.legs?.find(leg => !leg.is_current && leg.state !== 'COMPLETED')?.node_id
    ?? adapter?.snapshot?.route_plan?.legs?.find(leg => leg.is_current)?.node_id;
  const targetUiNode = uiNodeFromServer(targetServerNode);
  document.querySelectorAll('.stop-marker').forEach(marker => {
    marker.classList.toggle('is-current-target',Boolean(targetUiNode && marker.dataset.node === targetUiNode));
  });
  if (document.getElementById('robotPopover').classList.contains('is-open')) positionRobotPopover();
}

function wireMapOrderLinkage() {
  const panel = document.getElementById('sidePanel');
  panel.addEventListener('click', event => {
    const card = event.target.closest('.order-card[data-order]');
    if (card) focusOrder(card.dataset.order);
  });
  panel.addEventListener('keydown', event => {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    const card = event.target.closest('.order-card[data-order]');
    if (!card) return;
    event.preventDefault();
    focusOrder(card.dataset.order);
  });
  const markerLayer = document.getElementById('markerLayer');
  const focusFromMarker = event => {
    const marker = event.target.closest('.stop-marker[data-node]');
    if (!marker) return;
    event.preventDefault();
    event.stopPropagation();
    const order = orderForRouteNode(marker.dataset.node);
    if (order) focusOrder(order.id);
  };
  markerLayer.addEventListener('click',focusFromMarker);
  const robot = document.getElementById('robotMarker');
  robot.addEventListener('click',event => { event.stopPropagation(); toggleRobotPopover(); });
  robot.addEventListener('keydown',event => {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    event.preventDefault();
    toggleRobotPopover();
  });
  document.addEventListener('click',event => {
    if (!event.target.closest('#robotPopover,#robotMarker')) toggleRobotPopover(false);
  });
}

/* ---------- 9. Interaction ---------- */
function onPinClick(nodeId) {
  state.focusedOrderId = null;
  toggleRobotPopover(false);
  if (!state.selecting) {
    state.selecting = { from: nodeId, to: null };
  } else if (!state.selecting.from) {
    state.selecting.from = nodeId;
  } else if (!state.selecting.to && nodeId !== state.selecting.from) {
    state.selecting.to = nodeId;
  } else if (nodeId === state.selecting.from) {
    // reselect from
    state.selecting.from = nodeId; state.selecting.to = null;
  } else if (state.selecting.to) {
    // both already chosen — start a fresh selection from clicked pin
    state.selecting = { from: nodeId, to: null };
  }
  refreshPinVisuals();
  renderSvgOverlay();
  renderPanel();
}

function refreshPinVisuals() {
  clearPinStates();
  if (state.selecting) {
    if (state.selecting.from) setPinState(state.selecting.from, 'is-from');
    if (state.selecting.to) setPinState(state.selecting.to, 'is-to');
  }
}

function cancelSelection() {
  state.selecting = null;
  clearPinStates();
  renderSvgOverlay();
  renderPanel();
}

function confirmSelection() {
  if (totalOpen() >= MAX_SLOTS) {
    showToast(`🚫 机器人已满（${MAX_SLOTS}/${MAX_SLOTS}），请稍后再试`);
    return;
  }
  const { from, to } = state.selecting;
  const typed = (state.selecting.name || '').trim();
  const name = typed || peekName();
  nameCursor++;
  const order = {
    id: orderSeq++, name, from, to,
    status: '排队中', phase: null,
    color: ORDER_COLORS[orderSeq % ORDER_COLORS.length],
    groupId: null, ts: Date.now(),
  };
  state.orders.push(order);
  const pooled = tryPoolOrStartOrder(order);
  state.selecting = null;
  clearPinStates();
  state.tab = 'active';
  showToast(pooled ? `「${order.name}」路线重合，机器人顺路配送` : `订单 #0${order.id} 已加入配送队列`);
  renderSvgOverlay();
  renderPanel();
}

/* ---------- 11. Boot ---------- */
// Panel reserves the left ~480px of the screen; the map lives in whatever's
// left of the viewport, scaled down only if that space is smaller than its
// native 1440x900 (never scaled up past native size).
const MAP_LEFT_RESERVE = 400, MAP_MARGIN = 12;
function layoutMap() {
  const mapLayer = document.getElementById('mapLayer');
  const compact = window.innerWidth <= 900;
  const reserve = compact ? 0 : MAP_LEFT_RESERVE;
  const margin = compact ? 12 : MAP_MARGIN;
  const availW = window.innerWidth - reserve - margin;
  const availH = compact ? window.innerHeight * .51 : window.innerHeight - margin * 2;
  const baseScale = Math.min(availW / 1440, availH / 900, 1) * 0.99;
  const viewportCenterX = compact ? window.innerWidth / 2 : reserve + availW / 2;
  const viewportCenterY = compact ? 72 + availH / 2 : window.innerHeight / 2 + 8;
  let scale = baseScale;
  let cx = viewportCenterX;
  let cy = viewportCenterY;
  const order = focusedOrder();
  if (order && NODES[order.from] && NODES[order.to]) {
    const robot = document.getElementById('robotMarker');
    const robotPoint = {x:parseFloat(robot.style.left) || NODES[state.robotPos].x,y:parseFloat(robot.style.top) || NODES[state.robotPos].y};
    const points = [NODES[order.from],NODES[order.to],robotPoint];
    const minX = Math.min(...points.map(point => point.x));
    const maxX = Math.max(...points.map(point => point.x));
    const minY = Math.min(...points.map(point => point.y));
    const maxY = Math.max(...points.map(point => point.y));
    const focusX = (minX + maxX) / 2;
    const focusY = (minY + maxY) / 2;
    const fitScale = Math.min(availW / Math.max(420,maxX - minX + 300),availH / Math.max(300,maxY - minY + 220));
    scale = Math.min(1,Math.max(baseScale,Math.min(fitScale,baseScale * (compact ? 1.30 : 1.22))));
    cx = viewportCenterX + (720 - focusX) * scale;
    cy = viewportCenterY + (450 - focusY) * scale;
  }
  mapLayer.style.left = `${cx}px`;
  mapLayer.style.top = `${cy}px`;
  mapLayer.style.transform = `translate(-50%,-50%) scale(${scale})`;
}

const PRESENTATION_NODE_LABELS = Object.freeze({
  1:'紫荆操场',2:'理科楼',3:'图书馆',4:'苏世民书院',5:'东大操场',
  6:'校医院',7:'学生宿舍',8:'东门',9:'大礼堂',10:'新清华学堂',
  11:'中央主楼',12:'A',13:'照澜院',14:'科技大楼'
});

function presentationNodeLabel(nodeId) {
  return PRESENTATION_NODE_LABELS[Number(nodeId)] || '定位中';
}

const cameraFeedState = {
  socket: null,
  lastFrameAt: 0,
  open: false,
};

function setCameraDockOpen(open) {
  cameraFeedState.open = Boolean(open);
  const dock = document.getElementById('cameraDock');
  const toggle = document.getElementById('cameraToggle');
  const viewer = document.getElementById('cameraViewer');
  if (!dock || !toggle || !viewer) return;
  dock.classList.toggle('is-open',cameraFeedState.open);
  toggle.setAttribute('aria-expanded',String(cameraFeedState.open));
  viewer.setAttribute('aria-hidden',String(!cameraFeedState.open));
}

function updateCameraDockStatus() {
  const dock = document.getElementById('cameraDock');
  const status = document.getElementById('cameraStatusText');
  const frame = document.getElementById('cameraFrame');
  const empty = document.getElementById('cameraEmpty');
  if (!dock || !status || !frame || !empty) return;
  const connected = Boolean(cameraFeedState.socket && cameraFeedState.socket.readyState === 1);
  const hasFrame = cameraFeedState.lastFrameAt > 0;
  const fresh = connected && hasFrame && Date.now() - cameraFeedState.lastFrameAt < 5000;
  dock.classList.toggle('has-frame',fresh);
  frame.hidden = !hasFrame;
  empty.hidden = hasFrame;
  if (fresh) status.textContent = 'Streaming live';
  else if (connected && hasFrame) status.textContent = 'Paused · Waiting for frame';
  else if (connected) status.textContent = 'Connected · Waiting for feed';
  else status.textContent = 'Connecting to feed';
}

function syncCameraFeedSocket(socket) {
  if (cameraFeedState.socket === socket) {
    updateCameraDockStatus();
    return;
  }
  cameraFeedState.socket = socket || null;
  updateCameraDockStatus();
  if (!socket) return;
  socket.addEventListener('message',event => {
    let message;
    try { message = JSON.parse(event.data); }
    catch (_error) { return; }
    if (message.type !== 'image_frame' || !message.data) return;
    const frame = document.getElementById('cameraFrame');
    if (!frame) return;
    frame.src = `data:image/jpeg;base64,${message.data}`;
    cameraFeedState.lastFrameAt = Date.now();
    updateCameraDockStatus();
  });
  socket.addEventListener('close',updateCameraDockStatus);
}

function wireCameraDock() {
  const toggle = document.getElementById('cameraToggle');
  const close = document.getElementById('cameraClose');
  if (toggle) toggle.addEventListener('click',() => setCameraDockOpen(!cameraFeedState.open));
  if (close) close.addEventListener('click',event => {
    event.stopPropagation();
    setCameraDockOpen(false);
  });
  document.addEventListener('keydown',event => {
    if (event.key === 'Escape' && cameraFeedState.open) setCameraDockOpen(false);
  });
  updateCameraDockStatus();
}

// Read-only presentation bridge: reflects the adapter snapshot into labels and
// CSS state. It never sends a command or changes delivery state.
function syncPresentationStatus() {
  const adapter = window.deliveryBackendAdapter;
  syncCameraFeedSocket(adapter && adapter.socket);
  const snapshot = adapter && adapter.snapshot;
  const rail = document.getElementById('systemRail');
  const hint = document.getElementById('hintChip');
  const stage = document.getElementById('stage');
  if (!rail || !hint || !stage) return;

  const socketOpen = Boolean(adapter && adapter.socket && adapter.socket.readyState === 1);
  const vehicle = snapshot && snapshot.vehicle;
  const isOnline = socketOpen && vehicle && vehicle.online_status === 'ONLINE';
  const connectionState = !socketOpen ? 'connecting' : (isOnline ? 'online' : 'offline');
  rail.dataset.state = connectionState;
  stage.dataset.connection = connectionState;
  stage.dataset.motion = String(vehicle && vehicle.motion_state || 'stopped').toLowerCase();

  const currentNodeText = vehicle && vehicle.current_node != null
    ? presentationNodeLabel(vehicle.current_node)
    : '定位中';

  if (!state.selecting) {
    if (!socketOpen) {
      hint.textContent = '服务器连接中 · 正在同步状态';
    } else if (!isOnline) {
      hint.textContent = '小车离线 · 订单将在上线后调度';
    } else if (snapshot.route_plan && snapshot.route_plan.legs && snapshot.route_plan.legs.some(leg => !leg.reachable)) {
      rail.dataset.state = 'connecting';
      hint.textContent = '部分路线异常 · 等待重新规划';
    } else if (vehicle.motion_state === 'MOVING') {
      hint.textContent = '小车行驶中 · 状态实时同步';
    } else {
      hint.textContent = `小车在线 · 当前位于${currentNodeText}`;
    }
  }

  updateRobotPopover();
  enhanceMapPresentation();

}

function boot() {
  seedOrders();
  buildStaticRoads();
  buildPins();
  renderSvgOverlay();
  renderPanel();
  wireMapOrderLinkage();
  wireCameraDock();
  // The map/robot position update every animation frame via animateRun()
  // (started by startNextRun()); the queue panel only needs a much slower
  // refresh for things like live ETA text, matching UI/index.html's own
  // 1s-interval renderLogs() decoupled from its 60fps run animation.
  setInterval(() => { if (state.run && !state.selecting) updateQueuePanelLive(); }, 1000);
  setInterval(syncPresentationStatus, 350);
  syncPresentationStatus();
  window.addEventListener('resize', layoutMap);
  layoutMap();
}

document.addEventListener('DOMContentLoaded', boot);

</script>
<script src="/backend-adapter.js"></script>
</body>
</html>
